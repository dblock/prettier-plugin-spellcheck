name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.x]
        prettier-version: [3.7.0, locked]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false prettier@3.7.0
        if: matrix.prettier-version == '3.7.0'
      - run: npm test
        if: matrix.node-version != '24.x' || matrix.prettier-version != 'locked'
      - run: npm run coverage
        if: matrix.node-version == '24.x' && matrix.prettier-version == 'locked'
      - uses: coverallsapp/github-action@v2
        if: matrix.node-version == '24.x' && matrix.prettier-version == 'locked'
        with:
          file: coverage/lcov.info
